[tools]
# global tool versions go here
# you can set these with `mise use -g`
node = 'lts'
doggo = "latest"

[settings]
# https://mise.jdx.dev/configuration.html#idiomatic-version-files
# tools can read the versions files used by other version managers
# for example, .nvmrc in the case of node's nvm or .python-version for uv
idiomatic_version_file_enable_tools = ['node', 'python']
